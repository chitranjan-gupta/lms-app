name: EAS Build Development
on:
  workflow_dispatch:
jobs:
  build:
    name: Install and build Android App
    runs-on: ubuntu-latest
    steps:
      - name: Setup repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Create envfile
        uses: SpicyPizza/create-envfile@v2.0
        with:
          envkey_DEBUG: false
          envkey_NAME: ${{ secrets.APP_NAME }}
          envkey_SLUG: ${{ secrets.APP_SLUG }}
          envkey_EAS_PROJECT_ID: ${{ secrets.APP_EAS_PROJECT_ID }}
          envkey_API_URL: ""
          envkey_STRIPE_PUBLISHABLE_KEY: ""
          envkey_STRIPE_MERCHANT_IDENTIFIER: ""
          envkey_STRIPE_URL_SCHEME: ""
          envkey_VEXO_API_KEY: ""
          envkey_BUNDLE_ID: ""
          envkey_PACKAGE: ""
          envkey_DESCRIPTION: ""
          envkey_EXPO_ACCOUNT_OWNER: ""
          envkey_EAS_UPDATE_URL: ""
          envkey_SCHEME: ""
          envkey_GOOGLE_SERVICES_JSON: ""
          file_name: .env.development

      - name: Fetch Environment Variables
        run: APP_ENV=development eas env:pull development

      - name: Update Environment Variables
        run : cat .env.local > .env.development

      - name: Build Android App
        run: APP_ENV=development eas build --platform android --profile development --local --output ${{ github.workspace }}/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ github.workspace }}/app-release.apk